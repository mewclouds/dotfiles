[project]
name = "dotfiles"
version = "0.1.0"
description = "Personal cross-platform dotfiles orchestrator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0,<7"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
dotfiles = "dotfiles.__main__:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["dotfiles", "tests"]
