# Public actions stay data-driven so another repository can reuse the runner.
actions:
  # Shared actions apply on every supported platform.
  - id: install_python_dependencies
    name: run_command
    description: Install Python dependencies with uv sync
    parameters:
      command: [uv, sync]
      inputs: [pyproject.toml, uv.lock]

  - id: shared_git_config
    name: link_file
    description: Apply shared Git configuration
    parameters:
      source: .config/.gitconfig
      target: '~/.gitconfig'
    elevation: admin

  - id: repository_git_hooks
    name: run_command
    description: Configure repository Git hooks
    parameters:
      command: [git, config, core.hooksPath, .githooks]

  - id: install_psscriptanalyzer
    name: run_command
    description: Install PSScriptAnalyzer PowerShell module
    parameters:
      command:
        - pwsh
        - -NoProfile
        - -Command
        - >-
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer |
          Where-Object { $_.Version -eq '1.25.0' })) { Install-Module
          PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force }

  - id: mise_config
    name: link_file
    description: Apply mise toolchain configuration
    parameters:
      source: .config/mise/config.toml
      target: '~/.config/mise/config.toml'
    elevation: admin

  - id: mise_install
    name: run_command
    description: Install mise tools
    parameters:
      command: [mise, install]
      inputs: [.config/mise/config.toml]

  # Windows actions apply only when the runtime platform is Windows.
  - id: windows_appx_bloat_removal
    name: run_command
    description: Remove Windows AppX bloat
    platform: windows
    parameters:
      command:
        - C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        - -NoProfile
        - -ExecutionPolicy
        - Bypass
        - -File
        - .\scripts\system\Remove-AppxBloat.ps1
      inputs: [scripts/system/Remove-AppxBloat.ps1]
    elevation: admin

  - id: windows_fastfetch_config
    name: link_file
    description: Apply Windows Fastfetch configuration
    platform: windows
    parameters:
      source: .config/fastfetch-win.jsonc
      target: '%USERPROFILE%/.config/fastfetch/config.jsonc'
    elevation: admin

  - id: windows_terminal_config
    name: copy_file
    description: Apply Windows Terminal configuration
    platform: windows
    parameters:
      source: .config/windows-terminal.json
      target: '%LOCALAPPDATA%/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json'

  - id: windows_wsl_config
    name: link_file
    description: Apply Windows WSL configuration
    platform: windows
    parameters:
      source: .config/.wslconfig
      target: '~/.wslconfig'
    elevation: admin

  - id: powershell_profile
    name: link_file
    description: Apply PowerShell profile
    platform: windows
    parameters:
      source: scripts/shell/profile.ps1
      target: '%USERPROFILE%/Documents/PowerShell/Microsoft.PowerShell_profile.ps1'
    elevation: admin

  - id: powershell_profile_extensions
    name: link_file
    description: Apply PowerShell profile extensions
    platform: windows
    parameters:
      source: scripts/shell/ProfileExtensions.ps1
      target: '%USERPROFILE%/Documents/PowerShell/ProfileExtensions.ps1'
    elevation: admin
