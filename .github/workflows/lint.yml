name: Quality check

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python project
        run: uv sync --locked

      - name: Lint Python
        run: uv run ruff check .

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Run Python tests
        run: uv run pytest
      
      # ubuntu-latest ships PowerShell 7 OOTB; pin PSScriptAnalyzer explicitly so
      # CI doesn't silently drift onto whatever version the runner image bakes in.
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      - name: Check PowerShell formatting
        shell: pwsh
        run: ./scripts/PSFormat.ps1 -Check

      - name: Lint PowerShell
        shell: pwsh
        run: ./scripts/PSLint.ps1
